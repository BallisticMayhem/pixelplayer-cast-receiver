<!DOCTYPE html>
<!--
  PixelPlayer custom Cast receiver (by Unixity).
  A CAF (Cast Application Framework) receiver that renders a Now-Playing screen styled to match
  the PixelPlayer app: album-art card, album-colored animated blob background, an M3-Expressive
  "squiggle" (wavy) progress bar, rounded type, and per-song theming extracted from the artwork.

  Hosting: deploy this folder over HTTPS (GitHub Pages), register a *Custom Receiver* in the Google
  Cast Developer Console pointing at the hosted index.html, then put the resulting Application ID in
  CastOptionsProvider.kt (RECEIVER_APP_ID). See cast-receiver/README.md.

  Note: album-art color extraction reads pixels from a <canvas>, which requires the art server to
  send `Access-Control-Allow-Origin: *` (added to the app's MediaFileHttpServerService). If that
  header is missing the receiver still works — it falls back to a neutral PixelPlayer theme.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>PixelPlayer</title>

  <!-- TEMP on-screen debug: surfaces any receiver error/log on the TV (no chrome://inspect needed).
       Armed before everything else so it catches CAF/receiver.js load errors. Remove once working. -->
  <script>
    (function () {
      window.__ppLogs = [];
      window.__ppLog = function (msg, kind) {
        try {
          var d = document.getElementById('debug');
          if (!d) { window.__ppLogs.push([msg, kind]); return; }
          d.style.display = 'block';
          var line = document.createElement('div');
          line.textContent = msg;
          if (kind === 'err') line.style.color = '#ff8a8a';
          d.appendChild(line);
          while (d.childNodes.length > 16) d.removeChild(d.firstChild);
        } catch (e) {}
      };
      window.addEventListener('error', function (e) {
        var stack = (e.error && e.error.stack)
          ? ' :: ' + String(e.error.stack).split('\n').slice(0, 2).join(' | ').slice(0, 220)
          : '';
        window.__ppLog('ERR: ' + (e.message || (e.error && e.error.message) || e.error) +
          ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '') + stack, 'err');
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__ppLog('REJECT: ' + (e.reason && (e.reason.message || e.reason)), 'err');
      });
    })();
  </script>

  <!-- A rounded, geometric font as the closest free stand-in for Google Sans Rounded.
       To match exactly, drop the real font file into this folder and add an @font-face. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- CAF receiver SDK. crossorigin=anonymous so window.onerror gets REAL error details from
       exceptions inside this script instead of the masked "Script error." (gstatic serves CORS). -->
  <script crossorigin="anonymous" src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    :root {
      /* Defaults (neutral PixelPlayer purple) — overwritten per-song from album art. */
      --bg-0: #161019;
      --bg-1: #241a2e;
      --blob-a: #6d4ea8;
      --blob-b: #b07bd6;
      --blob-c: #4b3b6b;
      --primary: #cdb4ff;
      --on-primary: #2a1c4a;
      --surface: rgba(255, 255, 255, 0.06);
      --on-surface: #efe7f7;
      --on-surface-dim: rgba(239, 231, 247, 0.66);
      --track: rgba(255, 255, 255, 0.18);
      --seek-pill: rgba(18, 12, 24, 0.6);
      --pill-bg: rgba(42, 28, 74, 0.85);
      --pill-fg: #cdb4ff;
    }

    /* TEMP on-screen debug overlay (hidden until something logs). Remove once working. */
    #debug {
      position: fixed; top: 0; left: 0; right: 0;
      max-height: 45vh; overflow: hidden;
      background: rgba(0, 0, 0, 0.72);
      color: #9effa0;
      font: 15px/1.45 ui-monospace, monospace;
      padding: 10px 14px;
      z-index: 99999;
      display: none;
      white-space: pre-wrap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg-0);
      font-family: 'Quicksand', system-ui, sans-serif;
      color: var(--on-surface);
    }

    /* The CAF media player hosts the actual media element — REQUIRED for playback (removing it
       entirely makes every LOAD fail with detailed error 905 LOAD_FAILED). But when visible it
       draws Google's stock now-playing UI over our custom DOM, so we park it OFF-SCREEN: it keeps
       a real rendered box (playback fine) that can never appear in the viewport. */
    cast-media-player {
      position: fixed;
      left: -200vw;
      top: -200vh;
      width: 100vw;
      height: 100vh;
      /* The default UI in the shadow DOM positions itself FIXED to the viewport, escaping the
         off-screen host box (seen on the TV). A non-none transform makes this element the
         containing block for fixed descendants, trapping them in the off-screen box; contain:
         paint additionally clips every descendant's painting to that box. */
      transform: translateZ(0);
      contain: paint;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    /* The framework injects its default UI as SEPARATE body siblings (this device injects
       <touch-controls> plus a bare <div>) — not inside <cast-media-player> at all. The JS sweep
       hides them but only every 2s (they flashed); CSS applies the instant they're inserted.
       The universal rule hides ANY unexpected body child while allowlisting all of ours. */
    touch-controls { display: none !important; }
    body > *:not(#debug):not(#bg):not(#scrim):not(#brand):not(#stage):not(#idle):not(#lyrics):not(cast-media-player):not(script) {
      display: none !important;
    }

    /* Fullscreen lyrics pushed from the phone — fades in over the stage; blobs stay as backdrop.
       Layout: lyric lines fill the view, with a bottom strip (small art + Song/Artist on the left)
       and the seekbar moved in at full width underneath. */
    #lyrics {
      position: absolute; inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      padding: 4vh 6vw 3.5vh;
      gap: 1.5vh;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 350ms ease;
    }
    body.lyrics-open #lyrics { opacity: 1; }
    body.lyrics-open #stage { opacity: 0; }
    #lyricsView {
      flex: 1 1 auto;
      overflow: hidden;
      position: relative;
    }
    #lyricsScroll {
      width: 100%;
      transition: transform 420ms cubic-bezier(.2, .7, .2, 1);
      will-change: transform;
    }
    .lyLine {
      font-weight: 700;
      font-size: clamp(22px, 4.6vh, 54px);
      line-height: 1.25;
      padding: 1.1vh 0;
      color: var(--on-surface-dim);
      opacity: 0.4;
      transition: color 250ms ease, opacity 250ms ease;
    }
    .lyLine.active {
      color: var(--primary);
      opacity: 1;
    }

    /* Animated album-colored background. Explicit z-indexes on all our layers so framework-
       injected elements (default UI internals) can't paint above the custom DOM. */
    #bg {
      position: absolute; inset: 0;
      z-index: 1;
      background:
        radial-gradient(120% 120% at 50% 120%, var(--bg-1) 0%, var(--bg-0) 70%);
      transition: background 900ms ease;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.65;
      will-change: transform;
      /* Soft edges come from a radial-gradient instead of filter: blur(80px) — giant blurred
         layers are brutally expensive on the TV GPU and were the main source of lag. The blobs
         are sized up a bit since the gradient fade eats into the visible radius. */
    }
    #blob1 { width: 78vw; height: 78vw; left: -18vw; top: -26vw; background: radial-gradient(circle, var(--blob-a) 0%, transparent 65%); animation: float1 11s ease-in-out infinite; }
    #blob2 { width: 68vw; height: 68vw; right: -20vw; top: 2vh;  background: radial-gradient(circle, var(--blob-b) 0%, transparent 65%); animation: float2 13s ease-in-out infinite; }
    #blob3 { width: 62vw; height: 62vw; left: 16vw;  bottom: -28vw; background: radial-gradient(circle, var(--blob-c) 0%, transparent 65%); animation: float3 15s ease-in-out infinite; }
    @keyframes float1 {
      0%,100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(18vw, 12vh) scale(1.18); }
      50% { transform: translate(8vw, 26vh) scale(0.95); }
      75% { transform: translate(22vw, 8vh) scale(1.12); }
    }
    @keyframes float2 {
      0%,100% { transform: translate(0,0) scale(1.05); }
      25% { transform: translate(-16vw, 14vh) scale(0.86); }
      50% { transform: translate(-22vw, -8vh) scale(1.15); }
      75% { transform: translate(-6vw, 18vh) scale(0.92); }
    }
    @keyframes float3 {
      0%,100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(16vw, -14vh) scale(1.16); }
      50% { transform: translate(-10vw, -22vh) scale(0.9); }
      75% { transform: translate(20vw, -6vh) scale(1.1); }
    }

    /* A subtle scrim so text stays legible over the blobs. */
    #scrim {
      position: absolute; inset: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.32) 100%);
    }

    #stage {
      z-index: 3;
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6vw;
      padding: 7vh 8vw;
      transition: opacity 350ms ease; /* fades out under the fullscreen lyrics */
    }

    #artWrap {
      flex: 0 0 auto;
      width: 38vh; height: 38vh;
      max-width: 42vw; max-height: 42vw;
      border-radius: 28px;
      overflow: hidden;
      /* Shadow blur kept modest: scaling a layer with a huge blurred shadow lagged the TV GPU. */
      box-shadow: 0 16px 36px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.05) inset;
      background: var(--surface);
      transition: transform 600ms cubic-bezier(.2,.7,.2,1);
      /* Own compositing layer: the play/pause scale + track-change pop animate a cached texture
         instead of re-rasterizing the rounded clip + shadow every frame (which visibly lagged). */
      will-change: transform;
    }
    #artWrap.paused { transform: scale(0.94); }
    /* Bouncy pop when the album art changes track (class re-applied from JS on art swap). */
    @keyframes artPop {
      0% { transform: scale(0.9); }
      55% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #artWrap.pop { animation: artPop 550ms cubic-bezier(.2, .7, .3, 1.15); }
    #art { width: 100%; height: 100%; object-fit: cover; display: block; }

    #info {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 46vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.4vh;
    }

    #title {
      font-weight: 700;
      font-size: clamp(28px, 5.2vh, 64px);
      line-height: 1.08;
      letter-spacing: -0.5px;
      color: var(--on-surface);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #artist {
      font-weight: 600;
      font-size: clamp(18px, 2.8vh, 32px);
      color: var(--on-surface-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #badge {
      align-self: flex-start;
      margin-top: 0.6vh;
      font-size: clamp(12px, 1.6vh, 18px);
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--on-primary);
      background: var(--primary);
      padding: 0.7vh 1.6vh;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 400ms ease, transform 400ms ease, background 900ms ease, color 900ms ease;
    }
    #badge.show { opacity: 1; transform: translateY(0); }

    /* Song file-info pill (sample rate • bitrate • format), matching the phone player's chip. */
    #songInfo {
      align-self: flex-start;
      margin-top: 0.6vh;
      font-size: clamp(12px, 1.6vh, 18px);
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--pill-fg);
      background: var(--pill-bg);
      padding: 0.7vh 1.6vh;
      border-radius: 999px;
      display: none; /* shown by JS when info is available */
    }

    /* Squiggle progress bar in a pill-shaped, darker themed container. */
    #progress {
      margin-top: 3vh;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }
    #seekPill {
      background: var(--seek-pill);
      border-radius: 999px;
      padding: 4px 16px;
    }
    #wave {
      width: 100%;
      height: 48px;
      display: block;
    }
    #times {
      display: flex;
      justify-content: space-between;
      font-size: clamp(13px, 1.7vh, 20px);
      font-weight: 600;
      color: var(--on-surface-dim);
      font-variant-numeric: tabular-nums;
    }

    /* App logo / wordmark, top-left, fades when idle splash would show. */
    #brand {
      position: absolute;
      z-index: 4;
      top: 5vh; left: 6vw;
      display: flex; align-items: center; gap: 12px;
      font-weight: 700;
      font-size: clamp(16px, 2.2vh, 26px);
      color: var(--on-surface);
      opacity: 0.9;
    }
    #brand img {
      width: 3.2vh; height: 3.2vh; min-width: 22px; min-height: 22px;
      border-radius: 24%;
    }

    /* Lyrics-mode bottom strip: small art + Song/Artist bottom-left, full-width seekbar below. */
    #lyBottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.4vh;
      flex: 0 0 auto;
    }
    #lyMini {
      display: flex;
      align-items: center;
      gap: 1.6vh;
      align-self: flex-start;
    }
    #lyArt {
      width: 8vh; height: 8vh;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      background: var(--surface);
    }
    #lyMeta { display: flex; flex-direction: column; min-width: 0; max-width: 60vw; }
    #lyTitle {
      font-weight: 700;
      font-size: clamp(15px, 2.3vh, 26px);
      color: var(--on-surface);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #lySub {
      font-weight: 600;
      font-size: clamp(12px, 1.8vh, 20px);
      color: var(--on-surface-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #lyProgressSlot { width: 100%; }
    #lyProgressSlot #progress { margin-top: 0; }

    /* Idle (no media) state */
    #stage.idle #info, #stage.idle #artWrap { opacity: 0; }
    #idle {
      position: absolute; inset: 0;
      z-index: 3;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 2vh;
      color: var(--on-surface-dim);
      font-weight: 600;
      font-size: clamp(20px, 3vh, 36px);
    }
    #stage.idle ~ #idle { display: flex; }
  </style>
</head>
<body>
  <div id="debug"></div>
  <cast-media-player></cast-media-player>

  <div id="bg">
    <div class="blob" id="blob1"></div>
    <div class="blob" id="blob2"></div>
    <div class="blob" id="blob3"></div>
  </div>
  <div id="scrim"></div>

  <div id="brand"><img src="icon.png" alt="" /><span>PixelPlayer</span></div>

  <div id="stage" class="idle">
    <div id="artWrap"><img id="art" alt="" crossorigin="anonymous" decoding="async" fetchpriority="high" /></div>
    <div id="info">
      <div id="title"></div>
      <div id="artist"></div>
      <div id="badge"></div>
      <div id="songInfo"></div>
      <div id="progress">
        <div id="seekPill"><canvas id="wave"></canvas></div>
        <div id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
    </div>
  </div>
  <div id="lyrics">
    <div id="lyricsView"><div id="lyricsScroll"></div></div>
    <div id="lyBottom">
      <div id="lyMini">
        <img id="lyArt" alt="" crossorigin="anonymous" />
        <div id="lyMeta"><span id="lyTitle"></span><span id="lySub"></span></div>
      </div>
      <div id="lyProgressSlot"></div>
    </div>
  </div>
  <div id="idle">
    <span class="dot" style="width:18px;height:18px;border-radius:6px;background:var(--primary);display:inline-block"></span>
    <span>Ready to play</span>
  </div>

  <!-- ?v= cache-buster: bump together with the "receiver.js vN loaded" log line whenever
       receiver.js changes — the cast platform caches scripts hard. -->
  <script src="receiver.js?v=18"></script>
</body>
</html>
